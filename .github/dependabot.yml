version: 2

# diffdeck은 캐럿 없이 정확 핀되어 있어(package.json) 새 버전이 저절로 흘러오지
# 않는다. 그 대신을 하는 설정 — Dependabot이 릴리스를 발견해 범프 PR을 연다.
#
# PR이 열리면 CI가 `bun install --frozen-lockfile`로 새 버전을 설치한 뒤
# diff-contract.test.ts를 돌리므로, 데몬 계약(bin 경로·CLI 플래그·x-diffdeck
# 헤더·토큰 경로)이 깨졌다면 그 PR에서 빨갛게 드러난다. 초록이어도 뷰어 외
# 변경이 있는지 릴리스 노트는 사람이 확인할 것 — CLAUDE.md의 범프 절차 참고.
updates:
  # `bun`은 `npm`과 별개 ecosystem이다. bun.lock을 다루는 건 이쪽뿐이라
  # `npm`으로 두면 package.json만 올리고 lockfile은 놔둬서, 모든 PR이
  # `bun install --frozen-lockfile`에서 죽는다. 버전 업데이트만 지원하고
  # 보안 업데이트는 지원하지 않으므로(GitHub 문서) 이 설정은 릴리스 추적용이다.
  - package-ecosystem: bun
    directory: "/"
    # diffdeck은 19일간 10개 릴리스(평균 이틀에 하나) 페이스이고 주말에도 나온다
    # — 1.3.1이 일요일 릴리스였다. **`daily`로 바꾸지 말 것**: 평일만 돌아 주말
    # 릴리스를 월요일까지 묵힌다. `interval: cron`일 때 `cronjob`은 필수다.
    # 시각은 `cronjob`이 아니라 `timezone`에 넣는다(GitHub 문서 지시).
    schedule:
      interval: cron
      cronjob: "0 9 * * *"
      timezone: Asia/Seoul
    # diffdeck만 감시한다. 나머지 devDependencies는 캐럿이라 필요할 때
    # `bun outdated`로 직접 본다 — 여기 넣으면 PR 소음만 는다.
    allow:
      - dependency-name: "@say8425/diffdeck"
    open-pull-requests-limit: 1
    commit-message:
      # release-please가 patch 릴리스를 내도록. diffdeck 범프는 사용자가 받는
      # 버전을 바꾸므로(배포된 dependencies가 곧 resolve 기준) 릴리스가 필요하다.
      prefix: "fix(deps)"
    labels:
      - dependencies
