name: PR Check
on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Biome CLI
        uses: biomejs/setup-biome@v2
      - name: Run Biome
        run: biome ci src/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # The runner defaults bun to an internal Nexus registry that 403s on the
      # project's deps; bun ignores setup-node's .npmrc, so override bun's own
      # registry env (step env wins over the runner's global config).
      - run: bun install
        env:
          BUN_CONFIG_REGISTRY: https://registry.npmjs.org
      - run: bun run tsc --noEmit
