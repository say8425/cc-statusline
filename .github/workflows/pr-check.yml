name: PR Check
on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Biome CLI
        uses: biomejs/setup-biome@v2
      - name: Run Biome
        run: biome ci src/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # The runner's default bun registry is an internal Nexus that 403s on the
      # project's public deps. bun.lock now pins public-npm tarball URLs; this
      # env steers any non-pinned resolution to public npm too (step env wins).
      - run: bun install
        env:
          BUN_CONFIG_REGISTRY: https://registry.npmjs.org
      - run: bun run tsc --noEmit
