name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # release-please opens/updates the release PR; a human merges it on
      # purpose. A release is an npm publish, so it gets a review gate — and a
      # human merge is what makes publish run at all: a push made by
      # GITHUB_TOKEN does not re-trigger this workflow, so an auto-merged release
      # PR would silently never publish. (Every release here has in fact been
      # merged by hand; the removed `gh pr merge --auto` was a latent footgun.)
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: node

  publish:
    needs: release-please
    # release-please emits the STRING "false" when it creates nothing, and GHA
    # treats any non-empty string as truthy — so this must compare against
    # 'true' or every push would run publish. The workflow_dispatch arm is a
    # manual escape hatch to re-publish a release whose publish job failed (the
    # release_created signal only fires once, on the release PR's merge).
    if: ${{ needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: oven-sh/setup-bun@v2
      # Tokenless OIDC trusted publishing needs npm >= 11.5.1; Node 24's
      # bundled npm already satisfies that, so no global npm upgrade step.
      # setup-node v7 exports NODE_AUTH_TOKEN only when explicitly provided —
      # npm >= 11 tolerates the unresolved ${NODE_AUTH_TOKEN} .npmrc reference.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: bun install
      - run: bun run build
      - run: npm publish --provenance --access public
