name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node
      - if: ${{ steps.release.outputs.prs_created }}
        run: |
          PR_NUMBER=$(gh pr list --label "autorelease: pending" --json number --jq '.[0].number')
          if [ -n "$PR_NUMBER" ]; then
            gh pr edit $PR_NUMBER --add-assignee say8425
            gh pr merge $PR_NUMBER --auto --rebase
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  publish:
    needs: release-please
    # release-please emits the STRING "false" when it creates nothing, and GHA
    # treats any non-empty string as truthy — so this must compare against
    # 'true' or every push would run publish. The workflow_dispatch arm is a
    # manual escape hatch to re-publish a release whose publish job failed (the
    # release_created signal only fires once, on the release PR's merge).
    if: ${{ needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: oven-sh/setup-bun@v2
      # Node 24 + a recent npm: tokenless OIDC trusted publishing needs
      # npm >= 11.5.1, and `npm install -g npm@latest` (now npm 12, which
      # requires Node >= 22) fails on the old Node 20 with EBADENGINE.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest
      - run: bun install
      - run: bun run build
      - run: npm publish --provenance --access public
